name: Publish Expo OTA update
description: Validate, sign, and publish an Expo Updates v1 export to Cloudflare R2
author: Byulmaru

inputs:
  export-dir:
    description: Directory containing the approved Expo export and metadata.json
    required: true
  project:
    description: Project namespace used in public URLs and R2 keys
    required: true
  platform:
    description: Expo platform in the export to publish
    required: true
  channel:
    description: Fixed OTA channel to publish
    required: true
  runtime-version:
    description: Native runtime version served by this update
    required: true
  public-base-url:
    description: Public base URL of the static Expo OTA CDN or R2 origin
    required: false
    default: https://expo-ota.byulmaru.co
  r2-bucket:
    description: Cloudflare R2 bucket containing the static manifest and immutable assets
    required: false
    default: expo-ota
  r2-account-id:
    description: Cloudflare account ID used by the R2 S3 endpoint
    required: false
    default: 676a2d8e52515abd22c0edda7364cf73
  r2-access-key-id:
    description: R2 S3 access key ID
    required: true
  r2-secret-access-key:
    description: R2 S3 secret access key
    required: true
  signing-private-key:
    description: PEM encoded RSA private key used for Expo Updates code signing
    required: true
  keyid:
    description: Expo Updates signing key identifier
    required: false
    default: main

outputs:
  update-id:
    description: UUID assigned to the published update manifest
  manifest-url:
    description: Public URL of the published manifest

runs:
  using: node24
  main: action/dist/index.cjs

branding:
  color: blue
  icon: upload-cloud
